services:
  backend-dev:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    image: konsin1988/go-server-dev:latest
    container_name: solid-backend-dev 
    ports:
      - "8014:8014"
    volumes:
      - ./backend/app:/app
      - /backend/app/tmp
    environment:
      - GO_ENABLED=0
      - GO111MODULE=on
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_CKK=${DB_CKK}
      - DB_INTERNAL=${DB_INTERNAL}
      - DB_CERT=${DB_CERT}
      - BASE_LINK=${BASE_LINK}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auditso.rule=PathPrefix(`$BASE_LINK`)"
      - "traefik.http.routers.auditso.tls=true"
      - "traefik.http.middlewares.auditso-compress.compress=true"
    command: air /app
    networks:
      - audit 
  
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: konsin1988/go-server-prod:latest
    container_name: solid-backend
    ports: 
      - "8014:8014"
    environment:
      - GO_ENABLED=0
      - GO111MODULE=on
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_CKK=${DB_CKK}
      - DB_INTERNAL=${DB_INTERNAL}
      - DB_CERT=${DB_CERT}
      - BASE_LINK=${BASE_LINK}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s 
      retries: 3
      start_period: 10s
    networks:
      - audit

networks:
  audit:
    name: audit
    external: True
